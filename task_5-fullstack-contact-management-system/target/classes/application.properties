# Server Port Configuration
server.port=8080

# Spring Data JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database Settings: File-backed persistent storage in ./data/contact_db (Persists data across server restarts!)
spring.datasource.url=jdbc:h2:file:./data/contact_db;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Setup (Uncomment to switch to local MySQL server)
# spring.datasource.url=jdbc:mysql://localhost:3306/contact_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Security Default Credentials
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN
