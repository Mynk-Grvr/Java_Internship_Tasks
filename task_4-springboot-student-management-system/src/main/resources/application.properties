# Server Configuration
server.port=8080

# Spring Data JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database Configuration (Default: H2 In-Memory for Instant Out-of-the-Box Execution)
spring.datasource.url=jdbc:h2:mem:student_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Database Configuration (Uncomment below lines to connect directly to local MySQL server)
